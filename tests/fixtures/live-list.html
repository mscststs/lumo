<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Live list</title></head>
<body>
  <!--
    A list that updates between calls. Prepending a row shifts every
    `nth-of-type` index by one, which is what made the old selectors click the
    wrong row silently (research.md §4).
  -->
  <ul id="list">
      <li><div><span>Item 0</span><button>Add 0</button></div></li>
      <li><div><span>Item 1</span><button>Add 1</button></div></li>
      <li><div><span>Item 2</span><button>Add 2</button></div></li>
      <li><div><span>Item 3</span><button>Add 3</button></div></li>
      <li><div><span>Item 4</span><button>Add 4</button></div></li>
      <li><div><span>Item 5</span><button>Add 5</button></div></li>
      <li><div><span>Item 6</span><button>Add 6</button></div></li>
      <li><div><span>Item 7</span><button>Add 7</button></div></li>
  </ul>
</body>
</html>
