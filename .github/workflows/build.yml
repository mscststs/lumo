name: Build & Upload Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 语言包与 manifest 文案是构建输入：缺 key、占位符不一致或
      # public/_locales 未重新生成时，先在这里失败，避免带着残缺本地化发布。
      - run: npm run i18n:check
      - run: npm run i18n:manifest -- --check

      - run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: lumo-chrome-mv3
          path: .output/chrome-mv3/
          if-no-files-found: error
          include-hidden-files: true
